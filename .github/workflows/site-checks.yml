name: Site checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  primary-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check primary static site
        run: node scripts/check-site.mjs
      - name: Check menu behavior
        run: node scripts/test-menu-switcher.mjs
      - name: Check logo spotlight behavior
        run: node scripts/test-logo-reveal.mjs
      - name: Check inner-page motion
        run: node scripts/test-interior.mjs
      - name: Check booking form
        run: node scripts/test-contact.mjs
      - name: Install spreadsheet reader
        run: npm ci --prefix admin --ignore-scripts
      - name: Check event imports and financial archive
        run: node scripts/test-admin-import.mjs
      - name: Check business dashboard and database
        run: node scripts/test-admin.mjs
      - name: Check profit and statistics calculations
        run: node scripts/test-admin-reports.mjs
      - name: Check event page money and supply presets
        run: node scripts/test-admin-events.mjs
      - name: Check homepage album
        run: node scripts/test-home-moments.mjs
      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
